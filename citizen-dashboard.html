<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Watch - Citizen Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Community Watch</h2>
                <button class="close-sidebar" onclick="toggleSidebar()">×</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" data-page="home">🏠 Home</a>
                <a href="#" class="nav-link" data-page="my-reports">📋 My Reports</a>
                <a href="#" class="nav-link" data-page="incident-map">🗺️ Incident Map</a>
                <a href="#" class="nav-link" data-page="profile">👤 Manage Profile</a>
                <a href="#" class="nav-link" onclick="logout()">🚪 Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div class="user-info">
                    <span id="userName"></span>
                </div>
            </div>

            <!-- Home Page -->
            <div id="page-home" class="page active">
                <h1>Welcome, <span id="welcomeName"></span>!</h1>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Pending</h3>
                        <p class="stat-number" id="pendingCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>In Progress</h3>
                        <p class="stat-number" id="inProgressCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Resolved</h3>
                        <p class="stat-number" id="resolvedCount">0</p>
                    </div>
                </div>

                <div class="action-section">
                    <h2>Report New Incident</h2>
                    <form id="reportForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="reportType">Report Type *</label>
                                <select id="reportType" required>
                                    <option value="Report Crime/Incident">Report Crime/Incident</option>
                                    <option value="Watch Your House">Watch Your House</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="incidentType">Incident Type *</label>
                                <select id="incidentType" required></select>
                            </div>
                        </div>

                        <div class="form-group" id="customIncidentGroup" style="display:none;">
                            <label for="customIncidentName">Custom Incident Name *</label>
                            <input type="text" id="customIncidentName">
                        </div>

                        <div class="form-group">
                            <label for="location">Location *</label>
                            <input type="text" id="location" placeholder="Jalan, Taman Tambun Perdana 1, Durian Tunggal" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" rows="4" placeholder="Describe the incident..."></textarea>
                        </div>

                        <div class="error-message" id="reportError"></div>
                        <div class="success-message" id="reportSuccess"></div>

                        <button type="submit" class="btn btn-primary">Submit Report</button>
                    </form>
                </div>
            </div>

            <!-- My Reports Page -->
            <div id="page-my-reports" class="page">
                <h1>My Reports</h1>
                <div id="reportsContainer"></div>
            </div>

            <!-- Incident Map Page -->
            <div id="page-incident-map" class="page">
                <h1>Incident Hotspot Map</h1>
                <p>Taman Tambun Perdana 1, Durian Tunggal, Melaka</p>
                <div class="map-container">
                    <div class="map-placeholder">
                        <p>📍 Map View</p>
                        <p>Incident Hotspots</p>
                    </div>
                    <div class="hotspot-list" id="hotspotList"></div>
                </div>
            </div>

            <!-- Profile Page -->
            <div id="page-profile" class="page">
                <h1>Manage Profile</h1>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Name (Read Only)</label>
                        <input type="text" id="profileName" readonly>
                    </div>
                    <div class="form-group">
                        <label>IC Number (Read Only)</label>
                        <input type="text" id="profileIC" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email (Read Only)</label>
                        <input type="email" id="profileEmail" readonly>
                    </div>
                    <div class="form-group">
                        <label for="profilePhone">Phone Number</label>
                        <input type="tel" id="profilePhone">
                    </div>
                    <div class="form-group">
                        <label for="profileAddress">Address</label>
                        <textarea id="profileAddress" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>

                <h2 style="margin-top: 2rem;">Change Password</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" required>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                    <div class="success-message" id="passwordSuccess"></div>
                    <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
            </div>
        </main>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script src="validation.js"></script>
    <script src="citizen-dashboard.js"></script>
</body>
</html>
